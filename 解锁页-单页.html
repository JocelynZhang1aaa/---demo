<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>开启和 Ta 的专属小说</title>
<style>
:root {
  --brand: #5b8def;
  --brand-rgb: 91,141,239;
  --accent: #e8882d;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0; padding: 0; height: 100%;
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
  background: #0f1115; color: #1a1a1a;
}
body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }

/* 手机容器 */
.phone {
  position: relative; width: 393px; height: 852px;
  background: #f5f5f5; border-radius: 38px; overflow: hidden;
  box-shadow: 0 30px 80px rgba(0,0,0,.55), 0 0 0 10px #1c1f26, 0 0 0 12px #2a2e37;
  display: flex; flex-direction: column;
}
.phone.no-frame {
  width: 100vw; height: 100vh; height: 100dvh;
  max-width: none; max-height: none; aspect-ratio: auto;
  border-radius: 0; box-shadow: none;
  position: fixed; top: 0; left: 0;
}
@media (min-width: 500px) and (orientation: landscape) {
  .phone.no-frame {
    --h: min(100vh - 48px, (100vw - 48px) * 16 / 9);
    height: var(--h); width: calc(var(--h) * 9 / 16);
    border-radius: 38px; box-shadow: 0 30px 80px rgba(0,0,0,.55), 0 0 0 10px #1c1f26, 0 0 0 12px #2a2e37;
    position: relative;
  }
}

/* 状态栏 */
.statusbar {
  position: absolute; top: 0; left: 0; right: 0;
  height: calc(54px + var(--safe-top)); padding-top: var(--safe-top);
  display: flex; align-items: center; justify-content: space-between;
  padding-left: 28px; padding-right: 28px;
  font-size: 14px; font-weight: 600; color: #1a1a1a;
  z-index: 50; pointer-events: none;
}
.statusbar .icons { display: flex; gap: 6px; align-items: center; }
.statusbar .bat { width: 24px; height: 12px; border: 1.5px solid currentColor; border-radius: 3px; position: relative; }
.statusbar .bat::after { content:""; position:absolute; right:-3px; top:3px; width:2px; height:5px; background:currentColor; border-radius:0 1px 1px 0; }
.statusbar .bat::before { content:""; position:absolute; left:1px; top:1px; bottom:1px; width:70%; background:currentColor; border-radius:1px; }

/* ===== 解锁页 ===== */
.unlock-page {
  background: linear-gradient(180deg, #eaf2fc 0%, #f0f4fa 35%, #f7f7f7 70%, #f5f5f5 100%);
  flex: 1; display: flex; flex-direction: column; overflow: hidden;
}
.unlock-scroll {
  flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
  padding-top: calc(68px + var(--safe-top));
  display: flex; flex-direction: column; align-items: center;
  scrollbar-width: none; -ms-overflow-style: none;
}
.unlock-scroll::-webkit-scrollbar { display: none; }

/* 头部装饰 */
.unlock-visual { text-align: center; padding: 14px 30px 6px; }
.unlock-mascot {
  width: 90px; height: 90px; object-fit: contain;
  border-radius: 50%;
  background: linear-gradient(145deg, #dce9fb, #eef4fc);
  display: flex; align-items: center; justify-content: center;
  font-size: 36px;
  box-shadow: 0 4px 16px rgba(91,141,239,.12), inset 0 -3px 8px rgba(255,255,255,.6);
}

/* 标题 */
.unlock-title {
  font-size: 22px; font-weight: 800; line-height: 1.3;
  color: #1a1a1a; text-align: center; margin: 6px 0 2px; letter-spacing: .5px;
}
.unlock-title-line {
  width: 80px; height: 2.5px;
  background: var(--brand); margin: 0 auto 20px; border-radius: 2px;
  opacity: .55;
}

/* 一键成书卡片（主卡片，带左边框强调） */
.unlock-feature {
  display: flex; align-items: flex-start; gap: 13px;
  margin: 0 24px 18px; padding: 15px 16px;
  background: rgba(255,255,255,.85); border-radius: 16px;
  border-left: 3.5px solid var(--brand);
  box-shadow: 0 2px 10px rgba(0,0,0,.04);
}
.unlock-feature-icon {
  flex-shrink: 0; width: 36px; height: 36px; color: var(--brand);
  background: rgba(var(--brand-rgb),.1); border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
}
.unlock-feature-icon svg { width: 22px; height: 22px; }
.unlock-feature-text { flex: 1; min-width: 0; }
.unlock-feature-title { font-size: 15px; font-weight: 700; color: #1a1a1a; margin-bottom: 3px; }
.unlock-feature-desc { font-size: 12.5px; color: #777; line-height: 1.55; }

/* ===== 创作设定区域 ===== */
.creation-settings { width: 100%; padding: 0 24px; }

/* --- 口味区 --- */
.flavor-section {
  margin-bottom: 16px;
  background: rgba(255,255,255,.75);
  border-radius: 16px;
  padding: 16px 17px 14px;
  border-left: 3.5px solid var(--accent);
  box-shadow: 0 2px 10px rgba(0,0,0,.04);
}
.flavor-header {
  display: flex; align-items: baseline; gap: 5px; margin-bottom: 11px;
}
.flavor-title { font-size: 15.5px; font-weight: 800; color: #1a1a1a; }
.flavor-hint { font-size: 12px; color: #aaa; font-weight: 400; }
.flavor-refresh {
  margin-left: auto; font-size: 12.5px; color: var(--accent); font-weight: 600;
  border: none; background: transparent; cursor: pointer;
  display: flex; align-items: center; gap: 3px; padding: 3px 0;
}
.flavor-refresh:active { opacity: .5; }
.refresh-icon { font-size: 14px; }
/* 标签：紧凑胶囊，两行排列 */
.flavor-tags { display: flex; flex-wrap: wrap; gap: 8px; }
.flavor-tag {
  font-size: 12.5px; color: #555; border: 1.3px solid #ddd;
  background: #fff; padding: 6px 13px; border-radius: 18px;
  cursor: pointer; transition: all .15s ease; white-space: nowrap; font-weight: 500;
  line-height: 1.25;
}
.flavor-tag:active { transform: scale(.95); }
.flavor-tag.active {
  color: #fff !important;
  background: var(--accent);
  border-color: var(--accent);
  font-weight: 600;
  box-shadow: 0 2px 8px rgba(232,136,45,.28);
}
.flavor-tag.flavor-custom {
  color: #bbb; border-style: dashed; border-color: #ddd;
}
.flavor-tag.flavor-custom.active {
  color: #fff !important;
  background: var(--accent);
  border-color: var(--accent);
  border-style: solid;
}

/* --- 故事设定区 --- */
.story-setting-section { margin-bottom: 4px; }
.story-setting-title {
  font-size: 15.5px; font-weight: 800; color: #1a1a1a;
  margin-bottom: 10px; padding-left: 2px;
}
/* 设定卡片：引用风格，左侧竖线 + 浅色底 */
.story-setting-card {
  background: linear-gradient(135deg, #fffdf8 0%, #faf8f4 100%);
  border-radius: 14px;
  padding: 15px 16px 13px;
  border-left: 3px solid var(--accent);
  position: relative;
}
.story-setting-content {
  font-size: 13px; line-height: 1.72; color: #444; margin-bottom: 12px;
}
.story-setting-content .setting-flavor-name {
  color: var(--accent); font-weight: 700;
}
.story-setting-content .setting-char-names {
  color: var(--accent); font-weight: 600;
}
/* 按钮区：紧凑行内按钮，不是全宽胶囊 */
.story-setting-actions {
  display: flex; gap: 10px; padding-top: 2px;
}
.story-action-btn {
  flex: 1; height: 34px; border-radius: 17px; font-size: 12.5px; font-weight: 600;
  cursor: pointer; transition: all .15s ease;
  display: flex; align-items: center; justify-content: center; gap: 3px;
  border: 1.3px solid var(--accent);
  background: transparent; color: var(--accent);
}
.story-action-btn:active { transform: scale(.96); opacity: .7; }
.story-setting-tip {
  margin-top: 12px; font-size: 11.5px; color: #ccc; line-height: 1.6;
  padding: 0 2px;
}

/* ===== 解锁按钮 ===== */
.unlock-action {
  width: 100%; padding: 20px 24px calc(30px + var(--safe-bottom));
  text-align: center; margin-top: auto;
}
.unlock-btn {
  display: flex; align-items: center; justify-content: space-between;
  width: 100%; height: 52px; border-radius: 26px; font-size: 16.5px; font-weight: 700;
  cursor: pointer; transition: all .15s; padding: 0 22px; box-sizing: border-box;
  background: transparent; color: var(--brand); border: 1.5px solid var(--brand);
  box-shadow: 0 2px 12px rgba(var(--brand-rgb),.15);
}
.unlock-btn:active { transform: scale(.98); background: rgba(var(--brand-rgb),.08); }
.unlock-btn-price { font-size: 14px; font-weight: 700; white-space: nowrap; flex-shrink: 0; }
.unlock-balance { margin-top: 10px; font-size: 12.5px; color: #999; text-align: center; }
.unlock-balance b { color: var(--brand); font-weight: 600; }

/* Toast */
.toast {
  position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%) translateY(10px);
  background: rgba(0,0,0,.78); color: #fff; font-size: 13px; padding: 10px 18px;
  border-radius: 20px; opacity: 0; transition: opacity .3s, transform .3s; pointer-events: none;
  z-index: 999;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
  <div class="phone no-frame">
    <div class="statusbar">
      <span id="statusTime">22:05</span>
      <span class="icons"><span>5G</span><span class="bat"></span></span>
    </div>

    <div class="unlock-page">
      <div class="unlock-scroll">
        <!-- 装饰 -->
        <div class="unlock-visual">
          <div class="unlock-mascot">📖</div>
        </div>

        <h1 class="unlock-title">开启和 Ta 的专属小说</h1>
        <div class="unlock-title-line"></div>

        <!-- 一键成书 -->
        <div class="unlock-feature">
          <div class="unlock-feature-icon">
            <svg viewBox="0 0 40 40" fill="none"><rect x="4" y="6" width="24" height="28" rx="3" stroke="currentColor" stroke-width="2.2"/><line x1="10" y1="14" x2="22" y2="14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="10" y1="20" x2="22" y2="20" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="10" y1="26" x2="16" y2="26" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="30" cy="30" r="8" fill="#FFD166"/><path d="M27 30l2 2 4-4" stroke="#1a1a1c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </div>
          <div class="unlock-feature-text">
            <div class="unlock-feature-title">一键成书</div>
            <div class="unlock-feature-desc">把你和 Ta 的聊天，编成一本属于你们的小说，随聊天持续更新。</div>
          </div>
        </div>

        <!-- 创作设定 -->
        <div class="creation-settings">
          <div class="flavor-section">
            <div class="flavor-header">
              <span class="flavor-title">口味</span>
              <span class="flavor-hint">（剧情模板，单选）</span>
              <button class="flavor-refresh" id="flavorRefresh"><span class="refresh-icon">↻</span> 换一换</button>
            </div>
            <div class="flavor-tags" id="flavorTags"></div>
          </div>

          <div class="story-setting-section">
            <div class="story-setting-title">故事设定</div>
            <div class="story-setting-card">
              <div class="story-setting-content" id="storySettingContent"></div>
              <div class="story-setting-actions">
                <button class="story-action-btn story-action-swap" id="storySwapBtn">↕ 角色互换</button>
                <button class="story-action-btn story-action-edit" id="storyEditBtn">✎ 编辑</button>
              </div>
            </div>
            <div class="story-setting-tip">提示：口味决定剧情走向类型，故事设定将作为 AI 创作的核心约束。确认后将开始生成第一章。</div>
          </div>
        </div>

        <!-- 解锁按钮 -->
        <div class="unlock-action">
          <button class="unlock-btn" id="unlockBtn">
            <span>解锁第 1 章</span>
            <span class="unlock-btn-price">⚡️限时免费</span>
          </button>
          <div class="unlock-balance">当前电量余额 <b>500 电量</b></div>
        </div>
      </div>
    </div>
  </div>

<script>
var FLAVOR_DATA = [
  { name: "青葱校园", setting: "夏侯澶与顾晚音因（校园误会/暗恋错过）在毕业后重逢，青涩情愫再次萌芽" },
  { name: "久别重逢", setting: "夏侯澶与顾晚音因（意外分离/各自远行）多年后在异地重逢，旧情复燃却物是人非" },
  { name: "破镜重圆", setting: "夏侯澶与顾晚音因（误会/现实压力）决裂，数年后解开误会重归于好" },
  { name: "火葬场文学", setting: "夏侯澶曾伤害顾晚音至心死离去，后知后觉疯狂弥补，而她已不再回头" },
  { name: "欢喜冤家", setting: "夏侯澶与顾晚音从针锋相对开始，在无数次斗嘴拌嘴中日久生情" },
  { name: "一方失忆", setting: "夏侯澶因意外失去记忆，顾晚音试图让他想起两人的过去，却不知他记得一切" }
];
var FLAVOR_PER_PAGE = 6;
var flavorPage = 0;
var activeFlavor = 2;
var charRoleSwapped = false;
var CHAR_A = "夏侯澶";
var CHAR_B = "顾晚音";

function renderFlavorTags() {
  var container = document.getElementById("flavorTags");
  var start = flavorPage * FLAVOR_PER_PAGE;
  var end = Math.min(start + FLAVOR_PER_PAGE, FLAVOR_DATA.length);
  var html = "";
  for (var i = start; i < end; i++) {
    html += '<button class="flavor-tag' + (i === activeFlavor ? ' active' : '') + '" data-idx="' + i + '">' + FLAVOR_DATA[i].name + '</button>';
  }
  html += '<button class="flavor-tag flavor-custom' + (activeFlavor === -1 ? ' active' : '') + '" data-idx="-1">+ 自定义</button>';
  container.innerHTML = html;
  var btns = container.querySelectorAll(".flavor-tag");
  for (var j = 0; j < btns.length; j++) {
    btns[j].addEventListener("click", function () {
      activeFlavor = parseInt(this.getAttribute("data-idx"), 10);
      charRoleSwapped = false;
      renderFlavorTags();
      renderStorySetting();
    });
  }
}

function renderStorySetting() {
  var content = document.getElementById("storySettingContent");
  if (activeFlavor < 0 || activeFlavor >= FLAVOR_DATA.length) {
    content.innerHTML = '<span style="color:#bbb">请选择一个口味模板，或点击「+ 自定义」自行编写设定</span>';
    return;
  }
  var f = FLAVOR_DATA[activeFlavor];
  var charA = charRoleSwapped ? CHAR_B : CHAR_A;
  var charB = charRoleSwapped ? CHAR_A : CHAR_B;
  var desc = f.setting.replace(/夏侯澶/g, charA).replace(/顾晚音/g, charB);
  desc = desc.replace(charA, '<span class="setting-char-names">' + charA + '</span>')
             .replace(charB, '<span class="setting-char-names">' + charB + '</span>');
  content.innerHTML = '"<span class="setting-flavor-name">' + f.name + '</span>" 故事设定：<br>' + desc;
}

document.getElementById("flavorRefresh").addEventListener("click", function () {
  var maxPage = Math.ceil(FLAVOR_DATA.length / FLAVOR_PER_PAGE) - 1;
  flavorPage = flavorPage >= maxPage ? 0 : flavorPage + 1;
  renderFlavorTags();
});

document.getElementById("storySwapBtn").addEventListener("click", function () {
  charRoleSwapped = !charRoleSwapped;
  renderStorySetting();
});

document.getElementById("storyEditBtn").addEventListener("click", function () { showToast("编辑功能开发中"); });
document.getElementById("unlockBtn").addEventListener("click", function () { showToast("解锁第 1 章"); });

var toastTimer = null;
function showToast(msg) {
  var toast = document.getElementById("toast");
  if (!toast) { toast = document.createElement("div"); toast.id = "toast"; toast.className = "toast"; document.body.appendChild(toast); }
  toast.textContent = msg; toast.classList.add("show");
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { toast.classList.remove("show"); }, 2000);
}

(function () {
  var d = new Date();
  document.getElementById("statusTime").textContent =
    String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0");
})();

renderFlavorTags();
renderStorySetting();
</script>
</body>
</html>
